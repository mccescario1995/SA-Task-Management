name: Deploy SATasker to Hostinger

on:
  push:
    branches:
      - main  # Adjust to your branch as needed

jobs:
  deploy:
    name: Deploy SATasker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath
          tools: composer

      - name: Install Dependencies
        run: |
          cd satasker  # Change to your Laravel folder
          composer install --optimize-autoloader --no-dev
          npm install
          npm run build  # If using Vite or similar for front-end assets

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: "./SATasker/"  # Include the folder name containing Laravel files
          target: ${{ secrets.HOSTINGER_SATASKER_PATH }}  # Hostinger's target path
          rm: true
          port: ${{ secrets.HOSTINGER_SSH_PORT }}

      - name: Run SSH Commands
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_SATASKER_PATH }}
            # Set up SATasker environment
            echo "APP_NAME=SATasker" > .env
            echo "APP_ENV=production" >> .env
            echo "APP_KEY=" >> .env
            echo "APP_DEBUG=true" >> .env
            echo "APP_URL=https://satasker.example.com/" >> .env
            echo "DB_CONNECTION=mysql" >> .env
            echo "DB_HOST=localhost" >> .env
            echo "DB_PORT=3306" >> .env
            echo "DB_DATABASE=your_satasker_db" >> .env
            echo "DB_USERNAME=your_satasker_user" >> .env
            echo "DB_PASSWORD='your_satasker_password'" >> .env
            echo "MAIL_FROM_ADDRESS=support@satasker.com" >> .env
            echo "MAIL_FROM_NAME=\"SATasker\"" >> .env
            composer install --optimize-autoloader --no-dev
            php artisan key:generate
            php artisan migrate --force
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
